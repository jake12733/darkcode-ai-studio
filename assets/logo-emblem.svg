    <path d="M22 60 H30 L34 56"/><path d="M22 70 H31"/><path d="M106 60 H98 L94 56"/><path d="M106 70 H97"/>
    <path d="M48 106 V98 L52 94"/><path d="M80 106 V98 L76 94"/>
