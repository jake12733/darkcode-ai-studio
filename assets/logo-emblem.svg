<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CFFC0"/>
      <stop offset=".55" stop-color="#00FF66"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#063d1c"/>
      <stop offset="1" stop-color="#010a04"/>
    </radialGradient>
    <filter id="gl" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- hex shield -->
  <path d="M64 5 L115 34.5 V93.5 L64 123 L13 93.5 V34.5 Z" fill="url(#core)" stroke="url(#g)" stroke-width="4" stroke-linejoin="round" filter="url(#gl)"/>
