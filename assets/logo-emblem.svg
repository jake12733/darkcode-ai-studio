  <path d="M77.5 58.5 L67 56.5 L67 63 L76 63.5 Z" fill="#00FF66" filter="url(#gl)"/>
  <!-- </> glyph -->
  <g stroke="#00FF66" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)">
    <path d="M57 70 L52 74 L57 78"/><path d="M71 70 L76 74 L71 78"/><path d="M66.5 68.5 L61.5 79.5"/>
