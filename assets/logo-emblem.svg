  <g fill="#00FF66"><circle cx="34" cy="56" r="1.8"/><circle cx="31" cy="70" r="1.8"/><circle cx="94" cy="56" r="1.8"/><circle cx="97" cy="70" r="1.8"/><circle cx="52" cy="94" r="1.8"/><circle cx="76" cy="94" r="1.8"/></g>
  <!-- hood -->
  <path d="M64 24 C45 24 35 41 35 60 C35 74 39 84 45 92 L83 92 C89 84 93 74 93 60 C93 41 83 24 64 24 Z" fill="#010d05" stroke="url(#g)" stroke-width="3.2" stroke-linejoin="round" filter="url(#gl)"/>
  <path d="M64 24 C58 34 56 40 56 46" fill="none" stroke="#00FF66" stroke-opacity=".5" stroke-width="1.4"/>
  <!-- face void -->
  <path d="M64 38 C52.5 38 46.5 49 46.5 61 C46.5 72 52 82 64 84.5 C76 82 81.5 72 81.5 61 C81.5 49 75.5 38 64 38 Z" fill="#000"/>
